name: pole-observability

services:
  greptimedb:
    image: greptime/greptimedb:v1.1.3
    container_name: pole-greptimedb
    command:
      - standalone
      - start
      - --http-addr=0.0.0.0:4000
      - --grpc-bind-addr=0.0.0.0:4001
      - --mysql-addr=0.0.0.0:4002
      - --postgres-addr=0.0.0.0:4003
    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:${GREPTIMEDB_GRPC_PORT:-14001}:4001"
      - "127.0.0.1:4002:4002"
      - "127.0.0.1:4003:4003"
    volumes:
      - greptimedb-data:/greptimedb_data
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.156.0
    container_name: pole-otel-collector
    command:
      - --config=/etc/otelcol/config.yaml
    depends_on:
      - greptimedb
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:13133:13133"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped

volumes:
  greptimedb-data:
